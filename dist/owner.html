<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Owner analytics · Boplo Flight</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#020611">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,300..800&display=swap">
  <link rel="stylesheet" href="/flight-app.css?v=17">
  <link rel="stylesheet" href="/owner.css?v=1">
  <script src="/hit.js?v=1" defer></script>
</head>
<body>
  <header class="oh night">
    <nav><a class="brand" href="/" aria-label="Boplo home"><img src="/assets/boplo-wordmark.webp" alt="Boplo" width="520" height="163"><span>Flight</span></a><span style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-light btn-sm" href="/retention.html">Retention</a><a class="btn btn-ghost btn-sm" href="/flight-app.html">Back to the flight desk</a></span></nav>
    <div class="oh-row">
      <div><h1 class="display">Owner analytics</h1><p data-gen>Visits, sign-ups, plans and revenue across Boplo Flight.</p>
        <div class="us" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" data-us placeholder="Find a user by name or email" aria-label="Find a user by name or email" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="us-res">
          <div class="us-res" id="us-res" role="listbox" hidden></div></div></div>
      <div class="seg" role="group" aria-label="Period">
        <button type="button" data-days="7" aria-pressed="false">7 days</button>
        <button type="button" data-days="30" aria-pressed="true">30 days</button>
        <button type="button" data-days="90" aria-pressed="false">90 days</button>
        <button type="button" data-days="365" aria-pressed="false">12 months</button>
      </div>
    </div>
  </header>
  <main class="ow" id="ow">
    <section class="tile s3 sk"></section><section class="tile s3 sk"></section><section class="tile s3 sk"></section><section class="tile s3 sk"></section>
    <section class="tile s12 sk" style="min-height:260px"></section>
  </main>
  <dialog class="ud" data-ud aria-label="User"><div class="ud-top"><button type="button" class="btn btn-line btn-sm" data-udx>Back to analytics</button><span class="sub" data-udn style="margin:0"></span></div><div class="ow" data-udb></div></dialog>
  <script src="/owner.js?v=15" defer></script>
</body>
</html>
