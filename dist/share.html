<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Student progress · Boplo Flight</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#020611">
  <link rel="icon" href="/boplo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,300..800&display=swap">
  <link rel="stylesheet" href="/flight-app.css?v=14">
  <style>
    body{background:var(--cloud)}
    .sh-hero{margin:10px;border-radius:var(--r-frame);padding:clamp(24px,4vw,48px) clamp(20px,4vw,56px) clamp(56px,6vw,80px);box-shadow:inset 0 0 0 1px var(--hair-d)}
    .sh-hero>*{position:relative}
    .sh-hero nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:clamp(28px,5vw,56px)}
    .sh-hero h1{font-size:clamp(36px,5.5vw,72px)}
    .sh-hero p{margin-top:12px;color:rgba(222,233,255,.76);font-size:clamp(15px,1.3vw,18px)}
    .sh-stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:26px}
    .sh-stats div{display:grid;gap:2px}.sh-stats span{font-size:12.5px;color:var(--mist)}.sh-stats b{font-size:clamp(24px,2.6vw,34px);color:#fff;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
    .sh-wrap{max-width:1180px;margin:-44px auto 0;padding:0 clamp(16px,3vw,32px) 56px;position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
    .sh-wrap h2{font-size:18px;font-weight:620;margin-bottom:12px}
    .sh-list{display:grid;gap:8px;list-style:none;padding:0;font-size:15px;color:var(--ink-2)}
    .sh-list li{display:flex;gap:10px}.sh-list .done{color:var(--ink-3);text-decoration:line-through}
    .sh-fl{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--hair-l)}
    .sh-fl:first-of-type{border-top:0;padding-top:0}
    .sh-fl .top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
    .sh-fl small{color:var(--ink-3);font-size:13px}
    .sh-fl p{color:var(--ink-2);font-size:14.5px;white-space:pre-wrap}
    .sh-stage{margin-top:14px}.sh-stage h3{font-size:13.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;display:flex;justify-content:space-between}
    .sh-items{display:flex;flex-wrap:wrap;gap:6px}
    .sh-items span{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--well);color:var(--ink-3);border:1px solid var(--hair-l)}
    .sh-items .s-p{background:rgba(10,98,255,.08);color:var(--electric);border-color:transparent}
    .sh-items .s-d{background:var(--electric);color:#fff;border-color:transparent}
    .s8{grid-column:span 8}.s4{grid-column:span 4}.s12{grid-column:span 12}
    .sh-msg{max-width:560px;margin:60px auto;text-align:center;padding:0 20px}
    footer.pf{max-width:1180px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 40px;color:var(--ink-3);font-size:13px}
    @media (max-width:900px){.s8,.s4{grid-column:span 12}}
  </style>
  <script src="/flight-rules.js?v=2" defer></script>
</head>
<body>
  <header class="sh-hero night">
    <nav><a class="brand" href="/" aria-label="Boplo home"><img src="/assets/boplo-wordmark.webp" alt="Boplo" width="520" height="163"><span>Flight</span></a><span class="chip" style="background:transparent;color:#fff;border-color:var(--hair-d)">Read-only</span></nav>
    <div data-head><h1 class="display">Loading…</h1></div>
  </header>
  <main class="sh-wrap" data-main></main>
  <footer class="pf">Shared by the student from Boplo Flight, a training companion. Their official logbook and your school’s records are the authority.</footer>
  <script>
  addEventListener('DOMContentLoaded', async () => {
    const R = window.BOPLO_RULES, $ = s => document.querySelector(s);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
    const fmt = (s, o = { day: 'numeric', month: 'short', year: 'numeric' }) => s ? parseISO(s).toLocaleDateString('en-GB', o) : '';
    const hm = m => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, '0')}`;
    const role = r => ({ dual: 'Dual', solo: 'Solo', pic: 'PIC' }[r] || r);
    const t = new URLSearchParams(location.search).get('t') || '';
    let d;
    try {
      if (t === 'example') d = { student: { name: 'Alex', licence: 'PPL(A)', authority: 'UK CAA', regime: 'uk', airport: 'EGHP · Popham', goalHours: 40, openingMinutes: 0 }, next: { lesson: 'Lesson 12 · Navigation', date: new Date(Date.now() + 4 * 864e5).toISOString().slice(0, 10), questions: 'When would you divert if the reservoir turn is late?\nWhich frequency do I change to first after departure?', checklist: '[x] Plot the route and mark the turn points\n[x] Work out diversion timings\n[ ] Read through the radio calls', notes: '' }, syllabus: JSON.stringify({ 'easa-ppl-a': { 1: 'd', 2: 'd', 3: 'd', 4: 'd', 5: 'd', 6: 'd', 7: 'd', 8: 'd', 9: 'd', 10: 'p' } }), totals: { flights: 12, minutes: 709, landings: 33 }, recent: [{ date: new Date(Date.now() - 8 * 864e5).toISOString().slice(0, 10), departure: 'EGHP', arrival: 'EGHP', aircraft: 'PA-28 Warrior', role: 'dual', minutes: 75, landings: 1, lesson: 'Lesson 11b · Navigation planning', notes: 'Turn at the reservoir was 40 seconds late. Start the timing from overhead, not abeam.' }] };
      else { const r = await fetch('/flight/shared?t=' + encodeURIComponent(t), { headers: { accept: 'application/json' } }); d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'This link isn’t available.'); }
    } catch (e) {
      $('[data-head]').innerHTML = `<h1 class="display">Link unavailable</h1><p>${esc(e.message)}</p>`;
      $('[data-main]').innerHTML = `<div class="tile s12 sh-msg"><p>Ask the student to send you a new link from their Boplo Flight desk.</p></div>`;
      return;
    }
    const s = d.student, total = d.totals.minutes + (s.openingMinutes || 0);
    document.title = `${s.name}’s training · Boplo Flight`;
    $('[data-head]').innerHTML = `<h1 class="display">${esc(s.name)}’s training</h1><p>${esc([s.licence, s.authority, s.airport].filter(Boolean).join(' · '))}</p>
      <div class="sh-stats"><div><span>Total time</span><b>${hm(total)}</b></div><div><span>Flights</span><b>${d.totals.flights}</b></div><div><span>Landings</span><b>${d.totals.landings}</b></div>${s.goalHours ? `<div><span>Goal</span><b>${s.goalHours} h</b></div>` : ''}</div>`;
    const checks = String(d.next.checklist || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^\[( |x)\]\s?(.*)$/i); return m ? { done: m[1].toLowerCase() === 'x', text: m[2] } : { done: false, text: l }; });
    const qs = String(d.next.questions || '').split('\n').map(x => x.trim()).filter(Boolean);
    let syl = '';
    try {
      const sy = R.syllabusFor(s.regime || R.regimeFor(s.countryCode || 'GB')), st = (JSON.parse(d.syllabus || '{}') || {})[sy.id] || {};
      const n = sy.items.filter(i => st[i.id] === 'd').length;
      syl = `<section class="tile s12"><div class="tile-head"><h2>${esc(sy.title)}</h2><span class="chip">${n} of ${sy.items.length} done</span></div><div class="syl-bar"><i style="width:${Math.round(n / sy.items.length * 100)}%"></i></div>
        ${sy.stages.map((stage, si) => { const items = sy.items.filter(i => i.stage === si); return `<div class="sh-stage"><h3><span>${esc(stage)}</span><span>${items.filter(i => st[i.id] === 'd').length}/${items.length}</span></div><div class="sh-items">${items.map(i => `<span class="s-${st[i.id] || 'n'}" title="${esc(i.name)}">${esc(i.id)} · ${esc(i.name)}</span>`).join('')}</div></div>`; }).join('')}
        <p class="footnote" style="margin-top:12px">Marked by the student. Dark blue is done, light blue is in progress.</p></section>`;
    } catch { }
    $('[data-main]').innerHTML = `
      <section class="tile s4"><h2>Next lesson</h2><p style="font-size:17px;font-weight:600">${esc(d.next.lesson || 'Not set')}</p>${d.next.date ? `<p class="hint">${esc(fmt(d.next.date, { weekday: 'long', day: 'numeric', month: 'long' }))}</p>` : ''}
        ${checks.length ? `<h2 style="margin-top:20px">Preparation</h2><ul class="sh-list">${checks.map(c => `<li class="${c.done ? 'done' : ''}">${c.done ? '✓' : '○'} ${esc(c.text)}</li>`).join('')}</ul>` : ''}
        ${qs.length ? `<h2 style="margin-top:20px">Questions for you</h2><ul class="sh-list">${qs.map(q => `<li>• ${esc(q)}</li>`).join('')}</ul>` : ''}</section>
      <section class="tile s8"><h2>Recent flights</h2>${d.recent.length ? d.recent.map(f => `<div class="sh-fl"><div class="top"><b>${esc(fmt(f.date))} · ${esc(String(f.departure || '').toUpperCase())} → ${esc(String(f.arrival || '').toUpperCase())}</b><span>${hm(f.minutes)} · ${esc(role(f.role))}</span></div><small>${esc([f.lesson, f.aircraft, `${f.landings} ldg`].filter(Boolean).join(' · '))}</small>${f.notes ? `<p>${esc(f.notes)}</p>` : ''}</div>`).join('') : '<p class="hint">No flights logged yet.</p>'}</section>
      ${syl}`;
  });
  </script>
</body>
</html>
