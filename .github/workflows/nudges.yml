# Sends Boplo Flight training reminder emails once a day.
# Needs a repository secret CRON_SECRET with the same value as the CRON_SECRET variable in Cloudflare Pages.
name: Flight reminders
on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily
  workflow_dispatch:
jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" https://boplo.app/flight/cron/nudges
