<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boplo</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #020611; color: #F2F6FF; }
    body { display: grid; place-items: center; font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 32px 24px; text-align: center; }
    p.mark { margin: 0 0 12px; font-style: italic; font-weight: 650; font-size: 42px; letter-spacing: -0.04em; color: #0A62FF; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 650; letter-spacing: -0.03em; }
    p { margin: 0; color: #8FA0C4; }
  </style>
</head>
<body>
  <main>
    <p class="mark">boplo</p>
    <h1>Can’t reach Boplo</h1>
    <p>The flight desk on boplo.app didn’t load. Check the connection and open the app again.</p>
  </main>
</body>
</html>
